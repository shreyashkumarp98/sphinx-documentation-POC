name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-commit-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[docs]"

      - name: Generate API documentation with sphinx-apidoc
        run: |
          source .venv/bin/activate
          cd docs/source
          sphinx-apidoc --module-first --force -o . ../..
          
          # Update modules.rst to include all generated modules
          cat > modules.rst << 'EOF'
sphinx-documentation-POC
========================

.. toctree::
   :maxdepth: 4

EOF
          
          # Add all .rst files except index, modules, and conf
          for file in *.rst; do
            if [[ "$file" != "index.rst" && "$file" != "modules.rst" && "$file" != "conf.rst" ]]; then
              basename="${file%.rst}"
              echo "   $basename" >> modules.rst
            fi
          done

      - name: Build Sphinx documentation
        run: |
          source .venv/bin/activate
          cd docs
          rm -rf build
          sphinx-build source build

      - name: Commit to gh-pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Copy built documentation to temporary location before switching branches
          echo "Copying built documentation to temp location"
          mkdir -p /tmp/docs-build
          cp -r docs/build/* /tmp/docs-build/
          
          # Create or checkout gh-pages branch
          if git ls-remote --heads origin gh-pages | grep -q 'gh-pages'; then
            echo "Checking out existing gh-pages branch"
            git checkout gh-pages
            git pull origin gh-pages --rebase
            # Remove all existing files except .git
            find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} + || true
          else
            echo "Creating new orphan gh-pages branch"
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
          
          # Copy built documentation from temp location
          echo "Copying built documentation from temp location"
          cp -r /tmp/docs-build/* . || echo "No files to copy"
          
          # List files for debugging
          echo "Files in gh-pages branch:"
          ls -la
          
          # Commit changes
          git add .
          git commit -m "Automated documentation update [skip ci]" || echo "No changes to commit"
          git push origin gh-pages --force-with-lease || git push origin gh-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-commit-docs
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
